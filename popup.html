<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 290px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff; color: #0f1419; }
    @media (prefers-color-scheme: dark) { body { background: #15202b; color: #e7e9ea; } }
    h1 { font-size: 15px; margin: 0 0 8px; }
    ul { padding-left: 18px; margin: 6px 0 10px; }
    kbd { border: 1px solid #8b98a5; border-radius: 4px; padding: 0 4px; font-size: 11px; }
    .st { font-size: 12px; margin-bottom: 10px; }
    .stats { border: 1px solid rgba(127,127,127,.3); border-radius: 10px; padding: 4px 8px; margin-bottom: 10px; }
    .stats table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .stats th, .stats td { padding: 2px 4px; text-align: right; white-space: nowrap; }
    .stats th { font-weight: 600; opacity: .6; font-size: 11px; }
    .stats th:first-child, .stats td:first-child { text-align: left; }
    .stats td.today { font-weight: 700; color: #1d9bf0; }
    button { width: 100%; background: #1d9bf0; color: #fff; border: 0; border-radius: 999px; padding: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h1>X Gợi Ý Bình Luận</h1>
  <div class="stats" id="stats"></div>
  <div class="st" id="st"></div>
  <ul>
    <li>Bấm <b>💬 Gợi ý</b> dưới mỗi bài trên x.com</li>
    <li><kbd>Alt</kbd>+<kbd>J</kbd> / <kbd>Alt</kbd>+<kbd>K</kbd>: bài sau / bài trước</li>
    <li><kbd>Alt</kbd>+<kbd>G</kbd>: gợi ý cho bài đang ở đầu màn hình</li>
    <li><kbd>Alt</kbd>+<kbd>P</kbd> hoặc nút <b>✍️ Gợi ý bài</b> ở ô đăng bài: viết bài mới theo chủ đề, thời điểm, con người, địa điểm</li>
    <li><kbd>Esc</kbd>: đóng bảng gợi ý</li>
  </ul>
  <button id="studio" style="margin-bottom:8px">📋 Content Studio <span id="pend"></span></button>
  <button id="post" style="margin-bottom:8px">✍️ Gợi ý bài đăng</button>
  <button id="opt">Cài đặt</button>
  <script src="popup.js"></script>
</body>
</html>
